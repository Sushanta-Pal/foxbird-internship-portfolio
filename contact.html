<section style="padding: 40px 10%;">
  <h2 style="color:var(--accent);">Get In Touch</h2>
  <form style="display:flex; flex-direction:column; gap:15px; max-width:400px;">
    <input type="email" placeholder="Your Email" style="padding:10px; border-radius:5px; border:none;" />
    <textarea placeholder="Message" rows="4" style="padding:10px; border-radius:5px; border:none;"></textarea>
    <button style="background:var(--accent); border:none; padding:12px; font-weight:bold; cursor:pointer;">Send Message</button>
  </form>
</section>
